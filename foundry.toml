[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
xlayer_testnet = "${XLAYER_TESTNET_RPC_URL}"
xlayer = "${XLAYER_RPC_URL}"

[etherscan]
xlayer_testnet = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/xlayer-test/contract", chain = 1952 }
xlayer = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/xlayer/contract", chain = 196 }
